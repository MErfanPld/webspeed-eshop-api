# Nginx on the host in front of the Docker services (see deploy/DEPLOY.md).
# Replace webspeed.ir with your PLATFORM_DOMAIN.
#
#   webspeed.ir, www, panel, <shop>.webspeed.ir  → Next.js (127.0.0.1:3000)
#   media.webspeed.ir                            → MinIO public bucket (127.0.0.1:9000)
#   custom shop domains                          → Next.js (add their certificates)
# The Next.js app proxies /api/v1 to Django itself; Django is not exposed.

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name webspeed.ir *.webspeed.ir;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Platform, central panel and every shop subdomain (one wildcard certificate)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webspeed.ir *.webspeed.ir;

    ssl_certificate     /etc/letsencrypt/live/webspeed.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webspeed.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 6m;   # 5 MB uploads + overhead

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # The shop is chosen from the host name: always pass the real host
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Central panel: like any store host, plus Django admin (landing content, plans,
# subscriptions) which is not served by Next.js. More specific than *.webspeed.ir.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.webspeed.ir;
    ssl_certificate     /etc/letsencrypt/live/webspeed.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webspeed.ir/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 6m;

    location /django-admin/ {
        client_max_body_size 200m;   # intro video uploads
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
    location /static/ {              # django-admin CSS/JS (WhiteNoise)
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# API for a frontend hosted elsewhere (e.g. Vercel). Only needed in that setup.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.webspeed.ir;
    ssl_certificate     /etc/letsencrypt/live/webspeed.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webspeed.ir/privkey.pem;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # keeps the visitor IP sent by Vercel first (TRUST_PROXY_HEADERS=True)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Public media (product images); more specific than *.webspeed.ir
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name media.webspeed.ir;
    ssl_certificate     /etc/letsencrypt/live/webspeed.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webspeed.ir/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $host;
        limit_except GET HEAD { deny all; }
        expires 30d;
    }
}

