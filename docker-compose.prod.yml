# Production overrides:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Put a TLS-terminating reverse proxy in front of `web` (and of MinIO, or use
# managed S3). Do not expose db/redis ports.
services:
  minio:
    ports: !reset []

  web:
    build:
      args:
        REQUIREMENTS: production
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--timeout", "60", "--access-logfile", "-"]
    volumes: !reset []
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DEBUG: "False"
