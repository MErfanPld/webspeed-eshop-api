name: Backend CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: webspeed
          POSTGRES_USER: webspeed
          POSTGRES_PASSWORD: webspeed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webspeed" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
      DATABASE_URL: postgres://webspeed:webspeed@localhost:5432/webspeed
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/development.txt
      - name: Lint
        run: ruff check .
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - name: Tests
        run: python manage.py test tests
      - name: Migrate + seed (idempotent)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          STORAGE_BACKEND: local
        run: |
          python manage.py migrate --noinput
          python manage.py seed
          python manage.py seed
      - name: Production settings check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          SECRET_KEY: ci-production-check-0123456789-0123456789-0123456789-abcdef
          ALLOWED_HOSTS: api.example.com
          CORS_ALLOWED_ORIGINS: https://shop.example.com
          S3_ACCESS_KEY: x
          S3_SECRET_KEY: y
        run: python manage.py check --deploy --fail-level WARNING
