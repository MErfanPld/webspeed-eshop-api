services:
  db:
    image: postgres:16-alpine
    container_name: webspeed-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webspeed}
      POSTGRES_USER: ${POSTGRES_USER:-webspeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webspeed}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webspeed} -d ${POSTGRES_DB:-webspeed}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webspeed-web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-webspeed}:${POSTGRES_PASSWORD:-webspeed}@db:5432/${POSTGRES_DB:-webspeed}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings.development
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
