# Development stack: API + PostgreSQL + Redis + MinIO (S3-compatible).
#   cp .env.example .env && docker compose up --build
# Production: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webspeed}
      POSTGRES_USER: ${POSTGRES_USER:-webspeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-webspeed}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-webspeed} -d ${POSTGRES_DB:-webspeed}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-webspeed}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-webspeed-secret}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: create buckets; media bucket is publicly readable, receipts bucket stays private
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_PUBLIC_BUCKET} &&
      mc mb --ignore-existing local/$${S3_PRIVATE_BUCKET} &&
      mc anonymous set download local/$${S3_PUBLIC_BUCKET} &&
      mc anonymous set none local/$${S3_PRIVATE_BUCKET}"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-webspeed}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-webspeed-secret}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-webspeed-media}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-webspeed-private}

  web:
    build:
      context: .
      args:
        REQUIREMENTS: development
    restart: unless-stopped
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgres://${POSTGRES_USER:-webspeed}:${POSTGRES_PASSWORD:-webspeed}@db:5432/${POSTGRES_DB:-webspeed}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  minio_data:
